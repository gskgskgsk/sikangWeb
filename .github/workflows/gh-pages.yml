# 自动部署到 GitHub Pages
# 每次 push 到 main 分支后自动构建并发布到 https://gskgskgsk.github.io/sikangWeb/
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# 授予部署所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 拉取完整历史，供 Hugo 的 .GitInfo/.Lastmod 使用
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Hugo 模块下载需要 Go（ubuntu 运行器自带，这里显式指定版本保证可复现）
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 与 hugoblox.yaml 中 build.hugo_version 保持一致
          hugo-version: '0.165.0'
          extended: true

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # 若仓库尚未开启 Pages，自动以 GitHub Actions 方式开启
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Generate Pagefind search index
        run: pnpm run pagefind

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
